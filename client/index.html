<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Website kami sedang dalam pengembangan." />
    <title>Sedang Dalam Pengembangan</title>
    <style>
      :root {
        --background: #09111f;
        --surface: rgba(20, 34, 56, 0.72);
        --text: #f4f7fb;
        --muted: #b5c1d3;
        --accent: #58d2a9;
        --accent-soft: rgba(88, 210, 169, 0.15);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 15% 12%, rgba(67, 126, 223, 0.26), transparent 28rem),
          radial-gradient(circle at 85% 88%, rgba(45, 189, 151, 0.19), transparent 25rem),
          var(--background);
      }

      .grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        background-image: linear-gradient(rgba(181, 193, 211, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(181, 193, 211, 0.12) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, black, transparent 75%);
      }

      main {
        position: relative;
        width: min(92%, 720px);
        padding: clamp(2rem, 6vw, 4.5rem);
        text-align: center;
        border: 1px solid rgba(181, 193, 211, 0.17);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 1.6rem;
        padding: 0.5rem 0.85rem;
        border-radius: 999px;
        color: #91e8c9;
        background: var(--accent-soft);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .pulse {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(88, 210, 169, 0.65);
        animation: pulse 1.8s infinite;
      }

      h1 {
        max-width: 600px;
        margin: 0 auto;
        font-size: clamp(2.25rem, 7vw, 4.8rem);
        line-height: 1.06;
        letter-spacing: -0.055em;
      }

      p {
        max-width: 540px;
        margin: 1.45rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.13rem);
        line-height: 1.7;
      }

      .divider {
        width: 76px;
        height: 4px;
        margin: 2.1rem auto 1.4rem;
        border-radius: 2px;
        background: linear-gradient(90deg, #58d2a9, #64a8ed);
      }

      .footer {
        margin: 0;
        font-size: 0.9rem;
        color: #8d9caf;
      }

      @keyframes pulse {
        70% { box-shadow: 0 0 0 9px rgba(88, 210, 169, 0); }
        100% { box-shadow: 0 0 0 0 rgba(88, 210, 169, 0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="grid" aria-hidden="true"></div>
    <main>
      <div class="status"><span class="pulse"></span> Dalam pengembangan</div>
      <h1>Sesuatu yang baru sedang kami siapkan.</h1>
      <p>
        Website ini masih dalam proses pengembangan. Kami sedang menyempurnakan setiap detail untuk menghadirkan pengalaman terbaik.
      </p>
      <div class="divider"></div>
      <p class="footer">Terima kasih atas kesabaran Anda. Silakan kunjungi kembali dalam waktu mendatang.</p>
    </main>
  </body>
</html>
